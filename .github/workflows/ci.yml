name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MONGO_URI: mongodb://localhost:27017/flash-sale
  REDIS_HOST: localhost
  REDIS_PORT: 6379
  CORS_ORIGIN: http://localhost:5173

jobs:
  server:
    name: Server lint & test
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        working-directory: server
        run: npm ci
      - name: Lint
        working-directory: server
        run: npm run lint
      - name: Unit tests
        working-directory: server
        run: npm run test
      - name: Integration (e2e) tests
        working-directory: server
        run: npm run test:e2e
      - name: Build
        working-directory: server
        run: npm run build

  client:
    name: Client lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        working-directory: client
        run: npm ci
      - name: Lint
        working-directory: client
        run: npm run lint
      - name: Build
        working-directory: client
        run: npm run build

  playwright:
    name: Playwright UI screenshots
    if: github.event_name == 'pull_request'
    needs: [server, client]
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Build and start the API server
        working-directory: server
        run: |
          npm run build
          nohup npm run start:prod > server.log 2>&1 &
          npx --yes wait-on http://localhost:3000/api/health/ping -t 30000

      - name: Build and start the frontend
        working-directory: client
        env:
          VITE_API_URL: http://localhost:3000/api
        run: |
          npm run build
          nohup npm run preview -- --port 5173 --strictPort > client.log 2>&1 &
          npx --yes wait-on http://localhost:5173 -t 30000

      - name: Run Playwright tests
        working-directory: client
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          PLAYWRIGHT_API_URL: http://localhost:3000/api
        run: npm run e2e

      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/playwright-report/
            client/e2e/screenshots/
          retention-days: 14

      - name: Upload server/client logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-logs
          path: |
            server/server.log
            client/client.log
          retention-days: 14
