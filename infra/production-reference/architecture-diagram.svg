<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 850" width="1120" height="850" role="img"
  aria-label="Architecture diagram: a browser reaches the frontend through CloudFront and S3, and the API through an ALB into ECS Fargate tasks running in private VPC subnets. Those tasks call ElastiCache Redis for the atomic stock check and DocumentDB for the durable purchase record. ECR, Secrets Manager, and CloudWatch sit outside the VPC as regional services. Application Auto Scaling watches ALB requests-per-target and adjusts the ECS task count.">
  <title>Production-reference architecture</title>
  <desc>Maps every resource in infra/production-reference/*.tf to its place in the request path, VPC network boundaries, and the stress-test-grounded autoscaling loop.</desc>

  <style>
    text { fill: #1b2027; font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace; }
    .muted { fill: #626b79; }
    .accent-text { fill: #c2540a; }
    .box { fill: #ffffff; stroke: #9aa2af; stroke-width: 1.3; }
    .box-accent { fill: #fbebdd; stroke: #c2540a; stroke-width: 1.4; }
    .boundary-vpc { fill: none; stroke: #9aa2af; stroke-width: 1.4; stroke-dasharray: 7 5; }
    .boundary-subnet { fill: none; stroke: #d5d9e0; stroke-width: 1.2; stroke-dasharray: 3 4; }
    .edge { fill: none; stroke: #9aa2af; stroke-width: 1.3; }
    .edge-accent { fill: none; stroke: #c2540a; stroke-width: 1.6; }
    .edge-dashed { fill: none; stroke: #9aa2af; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .arrowhead { fill: #9aa2af; }
    .arrowhead-accent { fill: #c2540a; }

    @media (prefers-color-scheme: dark) {
      svg { background: #12151a; }
      text { fill: #e7e9ed; }
      .muted { fill: #9aa2ae; }
      .accent-text { fill: #e2892f; }
      .box { fill: #1b1f26; stroke: #454d59; }
      .box-accent { fill: #3a2712; stroke: #e2892f; }
      .boundary-vpc { stroke: #454d59; }
      .boundary-subnet { stroke: #2b313b; }
      .edge { stroke: #454d59; }
      .edge-accent { stroke: #e2892f; }
      .edge-dashed { stroke: #454d59; }
      .arrowhead { fill: #454d59; }
      .arrowhead-accent { fill: #e2892f; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"></path>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead-accent"></path>
    </marker>
  </defs>

  <!-- Browser -->
  <rect x="530" y="18" width="180" height="46" rx="3" class="box"></rect>
  <text x="620" y="46" text-anchor="middle" font-size="13.5" font-weight="700">Browser</text>

  <!-- Browser -> CloudFront -->
  <path d="M555,64 C470,105 260,110 190,148" class="edge" marker-end="url(#arrow)"></path>
  <text x="320" y="100" text-anchor="middle" font-size="11.5" class="muted">GET / static assets</text>

  <!-- Browser -> ALB -->
  <path d="M660,64 C700,100 690,120 620,178" class="edge" marker-end="url(#arrow)"></path>
  <text x="700" y="110" text-anchor="middle" font-size="11.5" class="muted">POST /api/purchase</text>

  <!-- CloudFront (regional, outside VPC) -->
  <rect x="70" y="150" width="220" height="58" rx="3" class="box"></rect>
  <text x="180" y="174" text-anchor="middle" font-size="13" font-weight="700">CloudFront</text>
  <text x="180" y="192" text-anchor="middle" font-size="11" class="mono accent-text">frontend.tf</text>

  <!-- CloudFront -> S3 -->
  <path d="M180,208 L180,284" class="edge" marker-end="url(#arrow)"></path>
  <text x="196" y="248" font-size="11" class="muted">origin fetch (OAC)</text>

  <!-- S3 (regional, outside VPC) -->
  <rect x="70" y="284" width="220" height="58" rx="3" class="box"></rect>
  <text x="180" y="308" text-anchor="middle" font-size="13" font-weight="700">S3 — frontend build</text>
  <text x="180" y="326" text-anchor="middle" font-size="11" class="mono accent-text">frontend.tf</text>
  <text x="180" y="366" text-anchor="middle" font-size="10.5" class="muted">private bucket · no public access</text>

  <!-- VPC boundary — only real VPC resources live inside -->
  <rect x="380" y="118" width="640" height="470" class="boundary-vpc"></rect>
  <text x="396" y="140" font-size="11.5" class="mono muted">VPC 10.20.0.0/16 — vpc.tf</text>

  <!-- Public subnet -->
  <rect x="404" y="150" width="592" height="112" class="boundary-subnet"></rect>
  <text x="420" y="168" font-size="10.5" class="mono muted">public subnet × 2 AZ</text>

  <!-- ALB -->
  <rect x="450" y="178" width="220" height="58" rx="3" class="box"></rect>
  <text x="560" y="202" text-anchor="middle" font-size="13" font-weight="700">Application LB</text>
  <text x="560" y="220" text-anchor="middle" font-size="11" class="mono accent-text">alb.tf</text>

  <!-- NAT gateway -->
  <rect x="740" y="178" width="220" height="58" rx="3" class="box"></rect>
  <text x="850" y="202" text-anchor="middle" font-size="12.5" font-weight="700">NAT Gateway</text>
  <text x="850" y="220" text-anchor="middle" font-size="11" class="mono accent-text">vpc.tf</text>
  <text x="850" y="252" text-anchor="middle" font-size="10" class="muted">egress for ECR / Secrets / logs</text>

  <!-- Private subnet -->
  <rect x="404" y="284" width="592" height="280" class="boundary-subnet"></rect>
  <text x="420" y="302" font-size="10.5" class="mono muted">private subnet × 2 AZ</text>

  <!-- ALB -> ECS -->
  <path d="M560,236 L560,320" class="edge" marker-end="url(#arrow)"></path>
  <text x="574" y="282" font-size="11" class="muted">forwards to healthy task</text>

  <!-- ECS service -->
  <rect x="430" y="320" width="280" height="100" rx="3" class="box"></rect>
  <text x="570" y="346" text-anchor="middle" font-size="13" font-weight="700">ECS Fargate service — api</text>
  <text x="570" y="364" text-anchor="middle" font-size="11" class="mono accent-text">ecs.tf</text>
  <text x="570" y="384" text-anchor="middle" font-size="10.5" class="muted">desired 2 · autoscale 2–10 tasks</text>
  <text x="570" y="400" text-anchor="middle" font-size="10.5" class="muted">health check /api/health/ping</text>

  <!-- ECS -> Redis (hot path, accent) -->
  <path d="M710,350 C750,350 770,355 780,364" class="edge-accent" marker-end="url(#arrow-accent)"></path>
  <text x="870" y="320" text-anchor="middle" font-size="9.5" class="accent-text" font-weight="600">Lua EVAL: check + decrement stock</text>

  <!-- Redis -->
  <rect x="780" y="330" width="180" height="65" rx="3" class="box"></rect>
  <text x="870" y="353" text-anchor="middle" font-size="12.5" font-weight="700">ElastiCache Redis</text>
  <text x="870" y="370" text-anchor="middle" font-size="11" class="mono accent-text">elasticache.tf</text>
  <text x="870" y="386" text-anchor="middle" font-size="10" class="muted">Multi-AZ failover</text>

  <!-- ECS -> DocumentDB -->
  <path d="M710,400 C750,412 770,416 780,430" class="edge" marker-end="url(#arrow)"></path>
  <text x="870" y="418" text-anchor="middle" font-size="9.5" class="muted">write purchase record</text>

  <!-- DocumentDB -->
  <rect x="780" y="425" width="180" height="65" rx="3" class="box"></rect>
  <text x="870" y="448" text-anchor="middle" font-size="12.5" font-weight="700">DocumentDB</text>
  <text x="870" y="465" text-anchor="middle" font-size="11" class="mono accent-text">documentdb.tf</text>
  <text x="870" y="481" text-anchor="middle" font-size="10" class="muted">2 instances, encrypted</text>

  <!-- Regional services row, outside the VPC boundary -->
  <text x="404" y="628" font-size="10.5" class="mono muted">regional / account-level services — not inside the VPC</text>

  <!-- ECR -->
  <rect x="404" y="644" width="200" height="68" rx="3" class="box"></rect>
  <text x="504" y="668" text-anchor="middle" font-size="12.5" font-weight="700">ECR</text>
  <text x="504" y="685" text-anchor="middle" font-size="11" class="mono accent-text">ecr.tf</text>
  <text x="504" y="701" text-anchor="middle" font-size="10" class="muted">scan on push · immutable tags</text>
  <path d="M480,644 C480,540 470,470 460,420" class="edge-dashed" marker-end="url(#arrow)"></path>
  <text x="420" y="540" text-anchor="middle" font-size="10.5" class="muted">image pull (deploy)</text>

  <!-- Secrets Manager -->
  <rect x="628" y="644" width="200" height="68" rx="3" class="box"></rect>
  <text x="728" y="668" text-anchor="middle" font-size="12.5" font-weight="700">Secrets Manager</text>
  <text x="728" y="685" text-anchor="middle" font-size="11" class="mono accent-text">secrets.tf</text>
  <text x="728" y="701" text-anchor="middle" font-size="10" class="muted">Mongo URI · Redis host</text>
  <path d="M700,644 C670,540 660,470 655,420" class="edge-dashed" marker-end="url(#arrow)"></path>
  <text x="740" y="540" text-anchor="middle" font-size="10.5" class="muted">injects at task start</text>

  <!-- CloudWatch -->
  <rect x="852" y="644" width="240" height="68" rx="3" class="box"></rect>
  <text x="972" y="668" text-anchor="middle" font-size="12.5" font-weight="700">CloudWatch Logs + Alarms</text>
  <text x="972" y="685" text-anchor="middle" font-size="11" class="mono accent-text">observability.tf</text>
  <text x="972" y="701" text-anchor="middle" font-size="10" class="muted">5xx rate · sold-out event filter</text>
  <path d="M600,420 C650,510 850,580 940,644" class="edge" marker-end="url(#arrow)"></path>
  <text x="770" y="560" text-anchor="middle" font-size="10.5" class="muted">app logs</text>
  <path d="M670,236 C900,280 1080,400 1010,644" class="edge" marker-end="url(#arrow)"></path>
  <text x="990" y="410" text-anchor="end" font-size="11" class="muted">HTTPCode_Target_5XX_Count</text>

  <!-- SNS -->
  <rect x="852" y="742" width="240" height="52" rx="3" class="box"></rect>
  <text x="972" y="764" text-anchor="middle" font-size="12.5" font-weight="700">SNS — alarms topic</text>
  <text x="972" y="781" text-anchor="middle" font-size="11" class="mono accent-text">observability.tf</text>
  <path d="M972,712 L972,742" class="edge" marker-end="url(#arrow)"></path>

  <!-- Autoscaling loop (accent) -->
  <rect x="404" y="742" width="330" height="80" rx="3" class="box-accent"></rect>
  <text x="569" y="768" text-anchor="middle" font-size="13" font-weight="700">Application Auto Scaling</text>
  <text x="569" y="786" text-anchor="middle" font-size="11" class="mono accent-text">autoscaling.tf</text>
  <text x="569" y="804" text-anchor="middle" font-size="11" font-weight="600" class="accent-text">target: 300 req/task</text>

  <path d="M600,236 C660,300 700,500 620,742" class="edge-accent" marker-end="url(#arrow-accent)"></path>
  <text x="700" y="470" text-anchor="middle" font-size="11" class="accent-text" font-weight="600">ALBRequestCountPerTarget</text>

  <path d="M500,742 C450,650 450,480 500,420" class="edge-accent" marker-end="url(#arrow-accent)"></path>
  <text x="420" y="580" text-anchor="middle" font-size="11" class="accent-text" font-weight="600">sets desired_count</text>
</svg>
